[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doma"
version = "0.1.0"
description = "Differentiable granular-material manipulation simulator and experiment code for DDBot."
readme = "README.md"
requires-python = ">=3.9,<3.12"
authors = [
  { name = "Xintong Yang" }
]
urls = { Homepage = "https://github.com/IanYangChina/DDBot", Repository = "https://github.com/IanYangChina/DDBot" }
dependencies = [
  "addict==2.4.0",
  "configargparse==1.7",
  "gym==0.20.0",
  "imageio==2.31.2",
  "matplotlib==3.5.1",
  "mesh-to-sdf==0.0.14",
  "numpy==1.18.5",
  "open3d==0.16.0",
  "pandas==1.3.5",
  "plotly==5.18.0",
  "pyyaml==6.0.1",
  "pyrender==0.1.45",
  "pyvista==0.38.6",
  "ribs==0.5.2",
  "scikit-image==0.19.3",
  "scikit-learn==1.0.2",
  "scipy==1.7.3",
  "taichi==1.6.0",
  "tensorboard==1.15.0",
  "torch==1.12.1+cu113",
  "tqdm==4.66.1",
  "trimesh==4.1.0",
  "vtk==9.2.6",
  "yacs==0.1.8"
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "isort>=5.13",
  "pytest>=8.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "simulator"

[tool.setuptools.packages.find]
where = ["simulator"]
include = ["doma*"]

[tool.setuptools.package-data]
doma = [
  "assets/meshes/processed/*.obj",
  "assets/meshes/processed/*.sdf",
  "assets/meshes/raw/*.obj",
  "assets/meshes/voxelized/*.vox",
  "engine/configs/manipulator_cfgs/*.yaml",
]
